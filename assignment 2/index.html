<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="navbar">
        <div class="container nav-flex">
            <div class="logo">Company</div>
            <nav>
                <a href="#">Features</a>
                <a href="#">Enterprise</a>
                <a href="#">Support</a>
                <a href="#">Pricing</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Our Amazing Product</h1>
            <p>Build something great with modern layout tools like Flexbox and Grid.</p>
            <button>Get Started</button>
        </div>
    </section>

    <section class="grid-section container">
        <div class="card">Feature One</div>
        <div class="card">Feature Two</div>
        <div class="card">Feature Three</div>
        <div class="card">Feature Four</div>
    </section>
</body>
</html>
